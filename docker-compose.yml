version: '3.8'
services:
  app:
    build:
      context: .
      args:
        - NEXT_PUBLIC_APP_ENV=docker
        - NEXT_PUBLIC_API_URL_PROD=http://localhost:3001
    ports:
      - "3000:3000"
      - "3001:3001"
    environment:
      - DB_HOST=db
      - DB_USER=user
      - DB_PASSWORD=password
      - DB_NAME=mtb_db
      - DB_PORT=3306
      - DIR_PATH=/MTB_WGS_cluster_analysis
      - NEXT_PUBLIC_APP_ENV=docker
      - NEXT_PUBLIC_API_URL_PROD=http://localhost:3001
    volumes:
      - ./MTB_WGS_cluster_analysis:/MTB_WGS_cluster_analysis
    depends_on:
      - db
  db:
    image: mysql:8.0
    restart: always
    environment:
      - MYSQL_ROOT_PASSWORD=root
      - MYSQL_DATABASE=mtb_db
      - MYSQL_USER=user
      - MYSQL_PASSWORD=password
    volumes:
      - db_data:/var/lib/mysql
volumes:
  db_data: