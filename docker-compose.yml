version: '3.8'
services:
  mtb-frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_APP_ENV=${NEXT_PUBLIC_APP_ENV:-docker}
        - NEXT_PUBLIC_API_URL_PROD=${NEXT_PUBLIC_API_URL_PROD}
    ports:
      - "${APP_PORT:-3000}:3000"
    env_file:
      - .env
    depends_on:
      - mtb-backend
    command: ["pm2", "start", "process.frontend.json", "--no-daemon"]
  mtb-backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "0.0.0.0:${API_PORT:-3001}:3001"
    env_file:
      - .env
    environment:
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_SECURE: ${SMTP_SECURE}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      SMTP_FROM: ${SMTP_FROM}
    volumes:
      - "${MTB_ANALYSIS_DIR_HOST:-./MTB_WGS_cluster_analysis}:${DIR_PATH:-/app/MTB_WGS_cluster_analysis}"
    depends_on:
      - mysql
    command: ["pm2", "start", "process.backend.json", "--no-daemon"]
  mysql:
    image: mysql:8.0
    restart: always
    environment:
      - MYSQL_ROOT_PASSWORD=${DB_PASSWORD:-change-me}
      - MYSQL_DATABASE=${DB_NAME:-mtb_db}
      - MYSQL_USER=${DB_USER:-user}
      - MYSQL_PASSWORD=${DB_PASSWORD:-change-me}
    volumes:
      - db_data:/var/lib/mysql
      - ./mtb-cluster.sql:/docker-entrypoint-initdb.d/init.sql
volumes:
  db_data:

