version: '3.8'
services:
  app:
    build:
      context: .
      args:
        - NEXT_PUBLIC_APP_ENV=${NEXT_PUBLIC_APP_ENV:-docker}
        - NEXT_PUBLIC_API_URL_PROD=${NEXT_PUBLIC_API_URL_PROD:-http://localhost:3001}
    ports:
      - "${APP_PORT:-3000}:3000"
      - "${API_PORT:-3001}:3001"
    env_file:
      - .env
    environment:
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_SECURE: ${SMTP_SECURE}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      SMTP_FROM: ${SMTP_FROM}
    volumes:
      - "${MTB_ANALYSIS_DIR_HOST:-./MTB_WGS_cluster_analysis}:${DIR_PATH:-/app/MTB_WGS_cluster_analysis}"
    depends_on:
      - db
  db:
    image: mysql:8.0
    restart: always
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD:-root}
      - MYSQL_DATABASE=${DB_NAME:-mtb_db}
      - MYSQL_USER=${DB_USER:-user}
      - MYSQL_PASSWORD=${DB_PASSWORD:-password}
    volumes:
      - db_data:/var/lib/mysql
      - ./mtb-cluster.sql:/docker-entrypoint-initdb.d/init.sql
volumes:
  db_data:
